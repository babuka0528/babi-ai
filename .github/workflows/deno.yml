
name: BABY AI - Node.js Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check app.js
        run: node --check app.js

      - name: Check server.js
        run: node --check server.js

      - name: Build BABY AI
        run: npm run build

