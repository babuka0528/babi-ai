<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101426">
  <meta name="description" content="BABI AI — Монгол хэлтэй хувийн AI туслах">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>BABI AI</title>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand-mark">B</div>
      <div><div class="brand">BABI AI</div><div class="subbrand">Баби AI туслах</div></div>
      <span class="status"><i></i> Бэлэн</span>
    </header>
    <section class="welcome" id="welcome">
      <div class="orb">✦</div>
      <h1>Сайн уу! Би BABI AI.</h1>
      <p>Юу мэдэхийг хүсэж байна? Монгол хэлээр асуугаарай.</p>
      <div class="suggestions">
        <button class="suggestion">Надад төлөвлөгөө гарга</button>
        <button class="suggestion">Энэ сэдвийг тайлбарла</button>
        <button class="suggestion">Санааг минь хөгжүүл</button>
      </div>
    </section>
    <section class="chat" id="chat" aria-live="polite"></section>
    <form id="chat-form" class="composer">
      <textarea id="prompt" rows="1" placeholder="BABI AI-д мессеж бич..." aria-label="Мессеж"></textarea>
      <button id="send" type="submit" aria-label="Илгээх">➤</button>
    </form>
    <footer>Мөнхзулд зориуллаа · BABI AI MVP</footer>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
